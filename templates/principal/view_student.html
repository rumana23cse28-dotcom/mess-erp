{% extends "base.html" %}
{% block content %}

<div class="card p-4" style="max-width:700px;margin:auto;">
  <div class="text-center">
    <img src="{{ url_for('static', filename='uploads/' + (s[8] or 'default.png')) }}"
         style="width:120px;height:120px;border-radius:50%;object-fit:cover">

    <h4 class="mt-3">{{ s[2] }}</h4>
    <p>{{ s[1] }}</p>
  </div>

  <table class="table mt-3">
    <tr><th>Branch</th><td>{{ s[4] }}</td></tr>
    <tr><th>Semester</th><td>{{ s[5] }}</td></tr>
    <tr><th>Phone</th><td>{{ s[6] }}</td></tr>
    <tr><th>Address</th><td>{{ s[7] }}</td></tr>
  </table>

  <a href="/students" class="btn btn-secondary w-100">Back</a>
</div>


{% endblock %}
