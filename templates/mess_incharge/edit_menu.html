{% extends "base.html" %}
{% block content %}

<h3 class="mb-4">Edit Mess Menu</h3>

<form method="POST" class="row g-3">

  <div class="col-md-3">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control"
           value="{{ data[1] }}" required>
  </div>

  <div class="col-md-3">
    <label class="form-label">Breakfast</label>
    <input type="text" name="breakfast" class="form-control"
           value="{{ data[2] }}" required>
  </div>

  <div class="col-md-3">
    <label class="form-label">Lunch</label>
    <input type="text" name="lunch" class="form-control"
           value="{{ data[3] }}" required>
  </div>

  <div class="col-md-3">
    <label class="form-label">Dinner</label>
    <input type="text" name="dinner" class="form-control"
           value="{{ data[4] }}" required>
  </div>

  <div class="col-md-12 mt-3">
    <button class="btn btn-success w-100">
      Update Menu
    </button>
  </div>

</form>

{% endblock %}
