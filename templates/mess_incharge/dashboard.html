{% extends "base.html" %}
{% block content %}

<!-- PAGE HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="fw-bold">Mess Incharge Dashboard</h2>
  <span class="role role-incharge">INCHARGE</span>
</div>

<!-- DASHBOARD CARDS -->
<div class="row g-4">

  <!-- INVENTORY -->
  <div class="col-md-6">
    <div class="card dashboard-card">
      <h4>Inventory Control</h4>
      <p class="text-muted">
        Add daily ration usage, manage incoming & remaining stock.
      </p>
      <a href="/inventory" class="btn btn-success w-100">
        Manage Inventory
      </a>
    </div>
  </div>

  <!-- MENU -->
  <div class="col-md-6">
    <div class="card dashboard-card">
      <h4>Mess Menu Management</h4>
      <p class="text-muted">
        Add, edit or delete daily breakfast, lunch and dinner menu.
      </p>
      <a href="/menu" class="btn btn-primary w-100">
        Manage Menu
      </a>
    </div>
  </div>

</div>

{% endblock %}
